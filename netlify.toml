[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # This is a Vite app; skip the UI-installed Next.js runtime plugin
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Single-page app fallback so client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
